<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#0f172a">Closing a session — the hand decides what is worth keeping</text>
  <text x="30" y="62" font-size="12.5" fill="#64748b">Ethan holds no rules about what matters. It only enforces what is allowed.</text>

  <!-- step 1 -->
  <rect x="30" y="88" width="200" height="66" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="130" y="112" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">1 · Hand finishes</text>
  <text x="130" y="132" font-size="11" fill="#0f766e" text-anchor="middle">the work is done and</text>
  <text x="130" y="146" font-size="11" fill="#0f766e" text-anchor="middle">the output is in hand</text>

  <path d="M230 121 L272 121" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 2 -->
  <rect x="274" y="88" width="230" height="66" rx="9" fill="#1e293b"/>
  <text x="389" y="112" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">2 · Ethan asks the same hand</text>
  <text x="389" y="131" font-size="10.5" fill="#94a3b8" text-anchor="middle">“anything here worth keeping?</text>
  <text x="389" y="145" font-size="10.5" fill="#94a3b8" text-anchor="middle">here is the KB map — you choose”</text>

  <path d="M504 121 L546 121" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 3 -->
  <rect x="548" y="88" width="362" height="66" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="729" y="110" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">3 · Hand answers in JSON</text>
  <text x="566" y="132" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#0f766e">{ keep: true, kb: "kb_kb",</text>
  <text x="566" y="147" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#0f766e">  title: …, body: …, why: … }</text>

  <path d="M729 154 L729 196" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 4 gate -->
  <rect x="270" y="198" width="640" height="112" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="590" y="222" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">4 · Ethan checks it against policy — the only judgement Ethan makes</text>
  <text x="292" y="246" font-size="11.5" fill="#9a3412">· does that KB exist, and is it writable?</text>
  <text x="292" y="266" font-size="11.5" fill="#9a3412">· does the KB's privacy class match the door the ask came from?</text>
  <text x="292" y="286" font-size="11.5" fill="#9a3412">· force layer = project, ontology from the KB map, cap the size</text>
  <text x="292" y="303" font-size="10.5" fill="#c2410c">the hand never performs the write — core's broker does, so attribution stays in one place</text>

  <path d="M400 310 L400 348" stroke="#dc2626" stroke-width="2" marker-end="url(#c)"/>
  <text x="410" y="333" font-size="11" font-weight="700" fill="#dc2626">fails</text>
  <path d="M780 310 L780 348" stroke="#16a34a" stroke-width="2" marker-end="url(#d)"/>
  <text x="790" y="333" font-size="11" font-weight="700" fill="#16a34a">passes</text>

  <rect x="270" y="350" width="260" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="378" font-size="12" fill="#991b1b" text-anchor="middle">refused, and told to you — never silent</text>

  <rect x="650" y="350" width="260" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="780" y="378" font-size="12" fill="#14532d" text-anchor="middle">written to that KB</text>

  <!-- step 5 -->
  <rect x="30" y="424" width="880" height="94" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="448" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">5 · Only then does Ethan ask its own question: can this close?</text>
  <text x="52" y="472" font-size="11.5" fill="#1e40af">Reads its own ledger: any task still running · any chain step unfinished · any question the hand left open</text>
  <text x="52" y="494" font-size="11.5" fill="#1e40af">Anything outstanding → <tspan font-weight="700">“not closing — 2 still pending”</tspan>.  Nothing outstanding → closed.</text>
  <text x="52" y="512" font-size="10.5" fill="#3b82f6">Startup reaps any row a killed process left at “running”, so a stale row can never jam this gate.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8 z" fill="#94a3b8"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8 z" fill="#dc2626"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
