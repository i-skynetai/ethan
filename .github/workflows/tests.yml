name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite is standard library only, so this is the whole build: no
    # install step, no lockfile, nothing to drift. If a version of Python
    # the README claims support for stops working, this is where it shows.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

  install:
    # The package installs with no dependencies and gives the two commands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .
      - name: The commands exist
        run: |
          cd /tmp
          ethan --help
          ETHAN_STATE_DIR=/tmp/ethan-state ethan-service --selftest

  lint:
    # Syntax errors and undefined or unused names only (ruff E9 and F) — the checks
    # that find real bugs, not style. Pinned so a new ruff release cannot fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Lint
        run: ruff check --select E9,F .
